type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.cucumber.jvm.DropStrictOption
displayName: Drop the `strict` option
description: >-
  Cucumber-JVM 7.0.0 removed the `strict` option, as scenarios are now always executed in strict mode.
tags:
  - testing
  - cucumber
recipeList:
  - org.openrewrite.java.RemoveAnnotationAttribute:
      annotationType: io.cucumber.junit.CucumberOptions
      attributeName: strict
  - org.openrewrite.java.RemoveAnnotationAttribute:
      annotationType: io.cucumber.testng.CucumberOptions
      attributeName: strict
  - org.openrewrite.properties.DeleteProperty:
      propertyKey: cucumber.execution.strict
      relaxedBinding: false
---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.cucumber.jvm.MigrateRuntimeOptionsBuilder
displayName: Migrate `RuntimeOptionsBuilder`
description: >-
  Cucumber-JVM 7.0.0 dropped `RuntimeOptionsBuilder.addDefaultFormatterIfAbsent()`, as no formatter is
  added implicitly any more, and renamed `addDefaultSummaryPrinterIfAbsent()` to
  `addDefaultSummaryPrinterIfNotDisabled()`, which defers to the new `setNoSummary()`. Mirrors the change
  Cucumber-JVM made to its own `io.cucumber.core.cli.Main`, which projects that run Cucumber
  programmatically tend to have copied.
tags:
  - testing
  - cucumber
recipeList:
  - org.openrewrite.java.RemoveMethodInvocations:
      methodPattern: io.cucumber.core.options.RuntimeOptionsBuilder addDefaultFormatterIfAbsent()
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: io.cucumber.core.options.RuntimeOptionsBuilder addDefaultSummaryPrinterIfAbsent()
      newMethodName: addDefaultSummaryPrinterIfNotDisabled
---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.cucumber.jvm.DropTimeoutAttribute
displayName: Drop the `timeout` attribute
description: >-
  Cucumber-JVM 5.0.0 removed the `timeout` attribute from step definition and hook annotations,
  in favor of asserting on the duration from within the step definition itself.
tags:
  - testing
  - cucumber
recipeList:
  - org.openrewrite.java.RemoveAnnotationAttribute:
      annotationType: cucumber.api.java..*
      attributeName: timeout
  - org.openrewrite.java.RemoveAnnotationAttribute:
      annotationType: io.cucumber.java..*
      attributeName: timeout
---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.cucumber.jvm.MigrateScenarioWriteAndEmbed
displayName: Migrate `Scenario.write` and `Scenario.embed`
description: >-
  Cucumber-JVM 6.0.0 removed `Scenario.write(String)` and `Scenario.embed(byte[], String)` along with
  `Scenario.embed(byte[], String, String)`, in favor of `Scenario.log(String)` and
  `Scenario.attach(byte[], String, String)`. The two argument `embed` emitted an attachment without a
  name, which `attach` expresses as a `null` name.
tags:
  - testing
  - cucumber
recipeList:
  - org.openrewrite.java.AddNullMethodArgument:
      methodPattern: io.cucumber.java.Scenario embed(byte[], java.lang.String)
      argumentIndex: 2
      parameterType: java.lang.String
      parameterName: name
  - org.openrewrite.java.AddNullMethodArgument:
      methodPattern: io.cucumber.java8.Scenario embed(byte[], java.lang.String)
      argumentIndex: 2
      parameterType: java.lang.String
      parameterName: name
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: io.cucumber.java.Scenario embed(byte[], java.lang.String, java.lang.String)
      newMethodName: attach
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: io.cucumber.java8.Scenario embed(byte[], java.lang.String, java.lang.String)
      newMethodName: attach
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: io.cucumber.java.Scenario write(java.lang.String)
      newMethodName: log
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: io.cucumber.java8.Scenario write(java.lang.String)
      newMethodName: log
---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.cucumber.jvm.FixTeluguLanguageCode
displayName: Fix the Telugu language code
description: >-
  Cucumber-JVM 7.0.0 removed the incorrect ISO 639-1 code `tl` for Telugu, which is now consistently `te`.
tags:
  - testing
  - cucumber
recipeList:
  - org.openrewrite.java.ChangePackage:
      oldPackageName: io.cucumber.java.tl
      newPackageName: io.cucumber.java.te
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: io.cucumber.java8.Tl
      newFullyQualifiedTypeName: io.cucumber.java8.Te
  - org.openrewrite.text.FindAndReplace:
      find: ^([ \t]*#[ \t]*language[ \t]*:[ \t]*)tl[ \t]*$
      replace: $1te
      regex: true
      multiline: true
      filePattern: '**/*.feature'
---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.cucumber.jvm.CucumberJava8ToJava
displayName: Migrate `cucumber-java8` to `cucumber-java`
description: >-
  Migrates `cucumber-java8` step definitions, `LambdaGlue` hooks and `LambdaGlue` type registrations to
  `cucumber-java` annotated methods.
tags:
  - testing
  - cucumber
recipeList:
  - org.openrewrite.cucumber.jvm.CucumberJava8HookDefinitionToCucumberJava
  - org.openrewrite.cucumber.jvm.CucumberJava8StepDefinitionToCucumberJava
  - org.openrewrite.cucumber.jvm.CucumberJava8TypeDefinitionToCucumberJava
  - org.openrewrite.cucumber.jvm.MigrateCucumberJava8ScenarioAndStatus
  # Keyed off the `cucumber-java8` types that are there to begin with, rather than the `cucumber-java` types the
  # migration introduces: a scanning recipe only sees the sources as they were when the cycle it runs in started,
  # and a build tool run ends before the cycle in which the migrated types would come into view
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.cucumber
      artifactId: cucumber-java
      version: 7.x
      familyPattern: io.cucumber*
      onlyIfUsing: io.cucumber.java8..*
      acceptTransitive: true
  # Only once no lambda glue is left, as a class that retained a `cucumber-java8` interface still needs it
  - org.openrewrite.cucumber.jvm.RemoveCucumberJava8Dependency
---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.cucumber.jvm.MigrateCucumberJava8ScenarioAndStatus
displayName: Migrate `io.cucumber.java8.Scenario` and `io.cucumber.java8.Status`
description: >-
  `Scenario` and `Status` are the only `io.cucumber.java8` types with an `io.cucumber.java` counterpart;
  the language interfaces such as `En` and the `LambdaGlue` body types have none, so renaming the package
  wholesale would point whatever the migration could not convert at a type that does not exist. Where such
  a body type does survive it also still expects the `cucumber-java8` `Scenario`, as in an anonymous
  `HookBody`, so leave both types be until the last of the lambda glue is gone.
tags:
  - testing
  - cucumber
preconditions:
  - org.openrewrite.java.search.DoesNotUseType:
      fullyQualifiedTypeName: io.cucumber.java8.*Body
      includeImplicit: true
recipeList:
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: io.cucumber.java8.Scenario
      newFullyQualifiedTypeName: io.cucumber.java.Scenario
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: io.cucumber.java8.Status
      newFullyQualifiedTypeName: io.cucumber.java.Status
---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.cucumber.jvm.CucumberToJunitPlatformSuite
displayName: Cucumber to JUnit test `@Suite`
description: Migrates Cucumber tests to JUnit test `@Suite`.
tags:
  - testing
  - cucumber
recipeList:
  - org.openrewrite.cucumber.jvm.CucumberAnnotationToSuite
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: org.junit.platform
      artifactId: junit-platform-suite
      version: 1.9.x
      onlyIfUsing: org.junit.platform.suite.api.*
      acceptTransitive: true
